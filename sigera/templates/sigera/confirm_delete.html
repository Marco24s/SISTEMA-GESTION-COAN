{% extends 'sigera/base_sigera.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="fw-bold text-danger"><i class="fa-solid fa-triangle-exclamation me-2"></i>{{ title }}</h4>
                <p class="mb-4">{{ message }}</p>
                {% if warnings %}
                    <div class="alert alert-warning mb-4 shadow-sm">
                        <ul class="mb-0 px-3">
                        {% for warning in warnings %}
                            <li class="fw-bold">{{ warning }}</li>
                        {% endfor %}
                        </ul>
                    </div>
                {% endif %}
                <form method="post" autocomplete="off">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="pin" class="form-label fw-bold">PIN de Seguridad (Borrado)</label>
                        <input type="password" name="pin" id="pin" class="form-control form-control-lg text-center" style="max-width: 250px; margin: 0 auto;" maxlength="4" inputmode="numeric" pattern="[0-9]*" required autofocus>
                        <div class="form-text text-center">Ingrese el PIN de 4 dígitos para autorizar esta eliminación.</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">
                            <i class="fa-solid fa-arrow-left me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-trash me-2"></i>Eliminar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
