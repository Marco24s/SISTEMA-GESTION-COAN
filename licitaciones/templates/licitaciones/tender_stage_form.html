{% extends "licitaciones/base_licitaciones.html" %}
{% load crispy_forms_tags %}

{% block title %}Actualizar Etapa{% endblock %}

{% block content %}
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i> Actualizar Etapa</h4>
                    <a href="{% url 'licitaciones:tender_stages' object.tender.pk %}" class="btn btn-sm btn-light text-primary">Volver al flujo</a>
                </div>
                <div class="card-body p-4">
                    <h5 class="mb-4 text-muted border-bottom pb-2">Etapa {{ object.stage_number }}: {{ object.name }}</h5>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'licitaciones:tender_stages' object.tender.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i> Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
