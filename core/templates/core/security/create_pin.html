{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 450px; width: 100%;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="icon-box mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 70px; height: 70px; background: linear-gradient(135deg, #198754 0%, #146c43 100%); border-radius: 20px; color: white; font-size: 1.5rem; box-shadow: 0 10px 20px rgba(25, 135, 84, 0.2);">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h4 class="fw-bold mb-1">Configurar PIN de Seguridad</h4>
                <p class="text-muted small">Cree un PIN de 4 dígitos para proteger su acceso</p>
            </div>

            <form method="POST" action="{% url 'create_pin' %}" id="create-pin-form">
                {% csrf_token %}
                <input type="hidden" name="system" value="{{ system }}">
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-uppercase">Nuevo PIN de 4 dígitos</label>
                    <div class="d-flex justify-content-between gap-2">
                        <input type="password" name="pin" class="form-control text-center py-3 fs-3 pin-field" maxlength="4" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-uppercase">Confirmar PIN</label>
                    <div class="d-flex justify-content-between gap-2">
                        <input type="password" name="confirm_pin" class="form-control text-center py-3 fs-3 pin-field" maxlength="4" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                    </div>
                </div>

                <div class="alert alert-info border-0 shadow-sm rounded-3 py-2 small mb-4">
                    <i class="fa-solid fa-circle-info me-1"></i> Evite combinaciones fáciles como 1234 o 0000.
                </div>

                <button type="submit" class="btn btn-success w-100 py-3 rounded-pill fw-bold shadow-sm">
                    <i class="fa-solid fa-lock-open me-2"></i> ESTABLECER PIN Y CONTINUAR
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="{% url 'portal' %}" class="text-decoration-none text-muted small">
                    Cancelar y volver al Portal
                </a>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('.pin-field').forEach(input => {
    input.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
    });
});
</script>
{% endblock %}
