{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
    /* Ocultar navbar y sidebar durante la validación de PIN */
    .navbar, .sidebar, nav, header { display: none !important; }
    body { padding-top: 0 !important; background: #f8f9fa; }
</style>
{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 400px; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);">
        <div class="card-body p-5 text-center">
            <div class="mb-4">
                <div class="icon-box mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 70px; height: 70px; background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); border-radius: 20px; color: white; font-size: 1.5rem; box-shadow: 0 10px 20px rgba(13, 110, 253, 0.2);">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h4 class="fw-bold mb-1">Seguridad: {{ system|upper }}</h4>
                <p class="text-muted small">Ingrese su PIN específico para este sistema</p>
            </div>

            <!-- PIN Indicators -->
            <div class="d-flex justify-content-center gap-3 mb-5" id="pin-indicators">
                <div class="dot" style="width: 18px; height: 18px; border: 2px solid #dee2e6; border-radius: 50%; transition: all 0.2s ease;"></div>
                <div class="dot" style="width: 18px; height: 18px; border: 2px solid #dee2e6; border-radius: 50%; transition: all 0.2s ease;"></div>
                <div class="dot" style="width: 18px; height: 18px; border: 2px solid #dee2e6; border-radius: 50%; transition: all 0.2s ease;"></div>
                <div class="dot" style="width: 18px; height: 18px; border: 2px solid #dee2e6; border-radius: 50%; transition: all 0.2s ease;"></div>
            </div>

            <form id="pin-form" method="POST" action="{% url 'verify_pin' %}">
                {% csrf_token %}
                <input type="hidden" name="system" value="{{ system }}">
                <input type="hidden" name="next" value="{{ next }}">
                <input type="hidden" name="pin" id="pin-input">

                <!-- Numeric Keypad -->
                <div class="row g-3 px-2">
                    {% for i in "123456789" %}
                    <div class="col-4">
                        <button type="button" class="btn btn-light w-100 py-3 fw-bold rounded-3 keypad-btn" data-val="{{ i }}" style="font-size: 1.25rem; transition: all 0.2s ease;">{{ i }}</button>
                    </div>
                    {% endfor %}
                    <div class="col-4">
                        <button type="button" class="btn btn-outline-danger w-100 py-3 rounded-3 keypad-btn" data-val="clear" title="Borrar">
                            <i class="fa-solid fa-delete-left"></i>
                        </button>
                    </div>
                    <div class="col-4">
                        <button type="button" class="btn btn-light w-100 py-3 fw-bold rounded-3 keypad-btn" data-val="0" style="font-size: 1.25rem;">0</button>
                    </div>
                    <div class="col-4">
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3" id="submit-btn" disabled>
                            <i class="fa-solid fa-check"></i>
                        </button>
                    </div>
                </div>
            </form>

            <div class="mt-4 pt-3 border-top">
                <a href="{% url 'portal' %}" class="text-decoration-none text-muted small">
                    <i class="fa-solid fa-arrow-left me-1"></i> Volver al Portal
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .keypad-btn:active {
        transform: scale(0.9) !important;
        background-color: #e9ecef !important;
    }
    .dot.filled {
        background-color: #0d6efd;
        border-color: #0d6efd;
        transform: scale(1.1);
        box-shadow: 0 0 10px rgba(13, 110, 253, 0.3);
    }
    .animate-shake {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const pinForm = document.getElementById('pin-form');
    const pinInput = document.getElementById('pin-input');
    const indicators = document.querySelectorAll('#pin-indicators .dot');
    const buttons = document.querySelectorAll('.keypad-btn');
    const submitBtn = document.getElementById('submit-btn');
    
    let currentPin = "";

    function updateUI() {
        indicators.forEach((dot, index) => {
            if (index < currentPin.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        });
        
        submitBtn.disabled = currentPin.length !== 4;
        
        // Auto-submit on 4th digit
        if (currentPin.length === 4) {
            setTimeout(() => {
                pinForm.submit();
            }, 300);
        }
    }

    buttons.forEach(btn => {
        btn.addEventListener('click', function() {
            const val = this.getAttribute('data-val');
            
            if (val === 'clear') {
                currentPin = currentPin.slice(0, -1);
            } else if (currentPin.length < 4) {
                currentPin += val;
            }
            
            pinInput.value = currentPin;
            updateUI();
        });
    });

    // Keyboard support
    document.addEventListener('keydown', function(e) {
        if (e.key >= '0' && e.key <= '9') {
            if (currentPin.length < 4) {
                currentPin += e.key;
                pinInput.value = currentPin;
                updateUI();
            }
        } else if (e.key === 'Backspace') {
            currentPin = currentPin.slice(0, -1);
            pinInput.value = currentPin;
            updateUI();
        } else if (e.key === 'Enter' && currentPin.length === 4) {
            pinForm.submit();
        }
    });

    // Show errors with shake effect
    {% if messages %}
        {% for message in messages %}
            if ("{{ message.tags }}" === "error") {
                document.querySelector('.card').classList.add('animate-shake');
            }
        {% endfor %}
    {% endif %}
});
</script>
{% endblock %}
