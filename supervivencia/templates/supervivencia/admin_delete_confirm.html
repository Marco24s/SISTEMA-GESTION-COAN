{% extends "supervivencia/base_supervivencia.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-8">
        <div class="card shadow-sm border-danger">
            <div class="card-header text-white bg-danger">
                <h4 class="mb-0"><i class="fa-solid fa-triangle-exclamation me-2"></i> Confirmar borrado definitivo</h4>
            </div>
            <div class="card-body">
                <p class="mb-3">Esta accion esta reservada a superusuarios y no se puede deshacer.</p>

                <div class="border rounded p-3 mb-3 bg-light">
                    <div class="small text-muted text-uppercase">Tipo</div>
                    <div class="fw-bold mb-2">{{ model_label }}</div>
                    <div class="small text-muted text-uppercase">Registro</div>
                    <div class="fw-bold">{{ object }}</div>
                    <div class="text-muted">ID: {{ object.pk }}</div>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <label class="form-label fw-bold">Escriba BORRAR para confirmar</label>
                    <input type="text" name="confirmation" class="form-control mb-3" autocomplete="off" autofocus>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'supervivencia:admin_delete' %}?type={{ model_type }}" class="btn btn-outline-secondary">
                            <i class="fa-solid fa-arrow-left me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-trash-can me-1"></i> Eliminar definitivamente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
