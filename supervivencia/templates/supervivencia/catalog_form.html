{% extends "supervivencia/base_supervivencia.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-11 col-xl-10">
        <div class="card shadow-sm border-0">
            <div class="card-header text-white" style="background:#b91c1c;">
                <h4 class="mb-0">{{ title|default:"Elemento de pirotecnia" }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}



                    <div class="d-flex justify-content-between mt-4">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">
                            <i class="fa-solid fa-arrow-left me-1"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-save me-1"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const classificationSelect = document.getElementById("id_classification");
        const systemSelect = document.getElementById("id_system");
        
        if (!classificationSelect || !systemSelect) return;

        // Extraer los valores originales del select de sistemas
        const allSystems = Array.from(systemSelect.options).map(opt => ({
            value: opt.value,
            text: opt.text
        }));

        function updateSystems() {
            const selectedClass = classificationSelect.options[classificationSelect.selectedIndex].text;
            const currentValue = systemSelect.value;
            
            // Limpiar opciones
            systemSelect.innerHTML = "";
            
            allSystems.forEach(sys => {
                // Agregar si es la opcion vacia, o si el texto del sistema empieza con "Clasificacion - "
                // (nuestro __str__ es "Clasificacion - Sistema")
                if (sys.value === "" || !classificationSelect.value || sys.text.startsWith(selectedClass + " - ")) {
                    const option = new Option(sys.text, sys.value);
                    systemSelect.add(option);
                }
            });
            
            // Restaurar el valor si sigue existiendo
            if (Array.from(systemSelect.options).some(opt => opt.value === currentValue)) {
                systemSelect.value = currentValue;
            }
        }

        classificationSelect.addEventListener("change", updateSystems);
        // Filtrar inicialmente
        updateSystems();

        // Convertir campos de texto simples en inputs múltiples dinámicos
        function makeMultiInput(inputId) {
            const originalInput = document.getElementById(inputId);
            if (!originalInput) return;
            
            // Ocultar input original
            originalInput.style.display = 'none';
            
            const container = document.createElement('div');
            container.className = 'multi-input-container';
            originalInput.parentNode.insertBefore(container, originalInput.nextSibling);
            
            const values = originalInput.value.split(',').map(v => v.trim()).filter(v => v);
            if (values.length === 0) values.push(""); // Al menos un campo vacio
            
            function render() {
                container.innerHTML = '';
                values.forEach((val, idx) => {
                    const row = document.createElement('div');
                    row.className = 'd-flex mb-2 gap-2';
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'form-control';
                    input.value = val;
                    input.addEventListener('input', (e) => {
                        values[idx] = e.target.value;
                        updateOriginal();
                    });
                    
                    row.appendChild(input);
                    
                    if (idx === values.length - 1) {
                        // Boton de agregar
                        const btnAdd = document.createElement('button');
                        btnAdd.type = 'button';
                        btnAdd.className = 'btn btn-outline-primary px-3';
                        btnAdd.innerHTML = '<i class="fa-solid fa-plus"></i>';
                        btnAdd.onclick = () => {
                            values.push("");
                            render();
                        };
                        row.appendChild(btnAdd);
                    } else {
                        // Boton de eliminar
                        const btnRem = document.createElement('button');
                        btnRem.type = 'button';
                        btnRem.className = 'btn btn-outline-danger px-3';
                        btnRem.innerHTML = '<i class="fa-solid fa-trash"></i>';
                        btnRem.onclick = () => {
                            values.splice(idx, 1);
                            render();
                            updateOriginal();
                        };
                        row.appendChild(btnRem);
                    }
                    
                    container.appendChild(row);
                });
            }
            
            function updateOriginal() {
                originalInput.value = values.map(v => v.trim()).filter(v => v).join(', ');
            }
            
            render();
        }

        makeMultiInput('id_alternate_part_number');
        makeMultiInput('id_alternate_nsn');
    });
</script>
{% endblock %}
